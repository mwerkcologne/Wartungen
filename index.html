<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wartungen – Fahrzeugübersicht</title>
  <style>
    :root {
      --bg: #121417;
      --card: #1c2026;
      --card-hover: #252a32;
      --border: #2e343d;
      --text: #f1f3f5;
      --muted: #9aa4b2;
      --accent: #e0b341;
      --accent-dark: #b88f28;
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.3px;
    }

    header p {
      margin: 4px 0 0;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .back-btn {
      display: inline-block;
      background: rgba(224, 179, 65, 0.12);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .folder-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }

    .folder-card:hover, .folder-card:active {
      background: var(--card-hover);
    }

    .folder-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .folder-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }

    .folder-arrow {
      font-size: 1.3rem;
      color: var(--accent);
      font-weight: bold;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .spec-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spec-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .spec-value {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-word;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #121417;
      color: var(--text);
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.primary-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #121417;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }

    button.primary-btn:active {
      background: var(--accent-dark);
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      font-size: 0.85rem;
      padding: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .entry {
      border-left: 3px solid var(--accent);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .entry-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .entry-notes {
      font-size: 0.9rem;
      color: #d0d7de;
      white-space: pre-wrap;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      padding: 0 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .specs-grid, .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div id="home-view">
      <header>
        <h1>Wartungen</h1>
        <p>Fahrzeugauswahl • Garage & Fuhrpark</p>
      </header>

      <div class="folder-list" id="folder-list"></div>
      <p class="hint">Tipp: Für NFC-Tags einfach den jeweiligen Fahrzeug-Ordner öffnen und die URL aus der Adresszeile (mit #aprilia, #z900 oder #saxonette) kopieren.</p>
    </div>

    <div id="detail-view" class="hidden">
      <button class="back-btn" onclick="goHome()">← Zurück zu Wartungen</button>
      <header>
        <h1 id="veh-title">Fahrzeugname</h1>
        <p id="veh-subtitle">Untertitel</p>
      </header>

      <section class="card">
        <h2>Fahrzeug- & Technikdaten</h2>
        <div class="specs-grid" id="specs-grid"></div>
      </section>

      <section class="card">
        <h2>Neue Wartung eintragen</h2>
        <form id="maintenance-form">
          <div class="row">
            <div class="form-group">
              <label for="date">Datum</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-group">
              <label for="km">Kilometerstand</label>
              <input type="number" id="km" placeholder="z. B. 14250" required />
            </div>
          </div>

          <div class="form-group">
            <label for="category">Wartung / Bauteil</label>
            <select id="category"></select>
          </div>

          <div class="form-group">
            <label for="notes">Details / Verbaute Teile</label>
            <textarea id="notes" rows="2" placeholder="z. B. Ölwechsel inkl. Filter, Drehmoment geprüft..."></textarea>
          </div>

          <button type="submit" class="primary-btn">+ Eintrag speichern</button>
        </form>
      </section>

      <section class="card">
        <h2>Wartungshistorie</h2>
        <div id="log-list"></div>
        <button type="button" class="btn-secondary" onclick="exportEntries()">Einträge als Text kopieren (Backup)</button>
      </section>
    </div>

  </div>

  <script>
    const VEHICLES = {
      aprilia: {
        name: "Aprilia SR50 Netscaper",
        subtitle: "Baujahr 1997 • Minarelli Horizontal LC",
        specs: [
          { label: "Modell / Typ", value: "Aprilia SR50 Netscaper (BJ 1997)" },
          { label: "Motor", value: "Minarelli Horizontal LC (2-Takt)" },
          { label: "2-Takt-Öl", value: "Vollsynthetisch (z. B. Motul 710)" },
          { label: "Getriebeöl", value: "SAE 80W-90 (ca. 110 ml)" },
          { label: "Keilriemen", value: "Minarelli lang (747 x 16,5 mm)" },
          { label: "Zündkerze", value: "NGK BR8HS / BR9ES" },
          { label: "Reifendruck (V / H)", value: "1,8 bar / 2,0 bar" },
          { label: "Kühlflüssigkeit", value: "Silikatfrei / Alu-geeignet (1:1)" }
        ],
        categories: [
          "Getriebeölwechsel",
          "2-Takt-Öl aufgefüllt",
          "Keilriemen & Variomatik",
          "Zündkerze",
          "Kühlwasser / Entlüftung",
          "Bremsen / Reifen",
          "Vergaser / Abstimmung",
          "Sonstiges"
        ]
      },
      z900: {
        name: "Kawasaki Z900",
        subtitle: "ZR900F • HSN 2299 / TSN AAQ • 92 kW (125 PS)",
        specs: [
          { label: "Modell / Schlüssel", value: "Kawasaki Z900 (ZR900F) • 2299 / AAQ" },
          { label: "Motor", value: "948 ccm R4 • 92 kW (125 PS) • Euro 5" },
          { label: "Motoröl", value: "10W-40 Vollsynthetisch (JASO MA2)" },
          { label: "Ölmenge (mit Filter)", value: "3,8 Liter (ohne Filter: 3,3 l)" },
          { label: "Anzugsmomente Öl", value: "Ablassschraube 29 Nm • Filter 17 Nm" },
          { label: "Zündkerzen", value: "NGK CR9EIA-9 (0,8–0,9 mm)" },
          { label: "Antrieb / Kette", value: "525er Kette (15/44 Zähne • 20–30 mm)" },
          { label: "Reifendruck (V / H)", value: "2,5 bar / 2,9 bar (120/70 & 180/55 ZR17)" }
        ],
        categories: [
          "Motoröl & Ölfilter",
          "Kette reinigen / spannen / schmieren",
          "Kettensatz neu",
          "Bremsflüssigkeit / Beläge",
          "Reifenwechsel / Luftdruck",
          "Luftfilter / Zündkerzen",
          "Kühlflüssigkeit",
          "HU / Inspektion",
          "Sonstiges"
        ]
      },
      saxonette: {
        name: "Sachs Saxonette Luxus",
        subtitle: "Motor Sachs 301 • 30 ccm 2-Takt mit E-Starter",
        specs: [
          { label: "Modell / Motor", value: "Sachs Saxonette Luxus (Sachs 301)" },
          { label: "Kraftstoff / Gemisch", value: "1:100 (bzw. 1:80) 2-Takt-Gemisch" },
          { label: "Getriebeöl", value: "SAE 80 / GL-4 (ca. 70–80 ml)" },
          { label: "Zündkerze", value: "Bosch WR 10 FC / NGK BP4 (0,5 mm)" },
          { label: "Vergaser", value: "Bing 81 oder TK Membranvergaser" },
          { label: "Elektrik / Start", value: "12V E-Starter & Seilzugstarter" },
          { label: "Reifendruck (V / H)", value: "ca. 2,5 – 3,0 bar (26\" Bereifung)" },
          { label: "Wartungspunkte", value: "Dekompressionsventil & Membranplatte" }
        ],
        categories: [
          "Getriebeölwechsel",
          "Vergaser / Membran reinigen",
          "Zündkerze",
          "Luftfilter",
          "E-Starter / Batterie (12V)",
          "Reifen / Schläuche / Bremsen",
          "Seilzüge & Deko-Ventil",
          "Sonstiges"
        ]
      }
    };

    let currentVehicleId = null;

    const homeView = document.getElementById("home-view");
    const detailView = document.getElementById("detail-view");
    const folderList = document.getElementById("folder-list");
    const form = document.getElementById("maintenance-form");
    const logList = document.getElementById("log-list");
    const dateInput = document.getElementById("date");

    function renderHome() {
      folderList.innerHTML = "";
      Object.keys(VEHICLES).forEach((key) => {
        const veh = VEHICLES[key];
        const count = getEntries(key).length;
        const card = document.createElement("div");
        card.className = "folder-card";
        card.onclick = () => openVehicle(key);
        card.innerHTML = `
          <div>
            <div class="folder-title">📁 ${veh.name}</div>
            <p class="folder-sub">${veh.subtitle} • ${count} ${count === 1 ? "Eintrag" : "Einträge"}</p>
          </div>
          <div class="folder-arrow">›</div>
        `;
        folderList.appendChild(card);
      });
    }

    function openVehicle(id) {
      if (!VEHICLES[id]) {
        goHome();
        return;
      }
      currentVehicleId = id;
      window.location.hash = id;

      const veh = VEHICLES[id];
      document.title = `Wartung – ${veh.name}`;
      document.getElementById("veh-title").textContent = veh.name;
      document.getElementById("veh-subtitle").textContent = veh.subtitle;

      const specsGrid = document.getElementById("specs-grid");
      specsGrid.innerHTML = veh.specs
        .map(
          (s) => `
          <div class="spec-item">
            <span class="spec-label">${s.label}</span>
            <span class="spec-value">${s.value}</span>
          </div>`
        )
        .join("");

      const catSelect = document.getElementById("category");
      catSelect.innerHTML = veh.categories
        .map((c) => `<option value="${c}">${c}</option>`)
        .join("");

      dateInput.valueAsDate = new Date();
      renderEntries();

      homeView.classList.add("hidden");
      detailView.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function goHome() {
      currentVehicleId = null;
      history.replaceState(null, "", window.location.pathname);
      document.title = "Wartungen – Fahrzeugübersicht";
      renderHome();
      detailView.classList.add("hidden");
      homeView.classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function getStorageKey(id) {
      return `wartung_v2_${id}`;
    }

    function getEntries(id) {
      const saved = localStorage.getItem(getStorageKey(id));
      return saved ? JSON.parse(saved) : [];
    }

    function saveEntries(id, entries) {
      localStorage.setItem(getStorageKey(id), JSON.stringify(entries));
    }

    function renderEntries() {
      const entries = getEntries(currentVehicleId);
      logList.innerHTML = "";

      if (entries.length === 0) {
        logList.innerHTML = '<p class="hint">Noch keine Wartungseinträge für dieses Fahrzeug vorhanden.</p>';
        return;
      }

      entries.forEach((entry) => {
        const div = document.createElement("div");
        div.className = "entry";
        const formattedDate = new Date(entry.date).toLocaleDateString("de-DE");
        div.innerHTML = `
          <div class="entry-header">
            <span>${formattedDate} • ${entry.km} km</span>
            <button class="delete-btn" onclick="deleteEntry(${entry.id})">Löschen</button>
          </div>
          <div class="entry-title">${entry.category}</div>
          ${entry.notes ? `<div class="entry-notes">${entry.notes}</div>` : ""}
        `;
        logList.appendChild(div);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!currentVehicleId) return;
      const entries = getEntries(currentVehicleId);
      const newEntry = {
        id: Date.now(),
        date: document.getElementById("date").value,
        km: document.getElementById("km").value,
        category: document.getElementById("category").value,
        notes: document.getElementById("notes").value.trim()
      };
      entries.unshift(newEntry);
      saveEntries(currentVehicleId, entries);
      renderEntries();
      document.getElementById("km").value = "";
      document.getElementById("notes").value = "";
    });

    function deleteEntry(entryId) {
      if (!confirm("Diesen Eintrag wirklich löschen?")) return;
      const entries = getEntries(currentVehicleId).filter((item) => item.id !== entryId);
      saveEntries(currentVehicleId, entries);
      renderEntries();
    }

    function exportEntries() {
      const veh = VEHICLES[currentVehicleId];
      const entries = getEntries(currentVehicleId);
      const header = `=== ${veh.name} ===\n`;
      const text = entries
        .map((e) => `${e.date} | ${e.km} km | ${e.category}: ${e.notes}`)
        .join("\n");
      navigator.clipboard.writeText(header + text).then(() => {
        alert(`Wartungseinträge für ${veh.name} wurden in die Zwischenablage kopiert!`);
      });
    }

    function checkHash() {
      const hash = window.location.hash.replace("#", "").toLowerCase();
      if (hash && VEHICLES[hash]) {
        openVehicle(hash);
      } else {
        goHome();
      }
    }

    window.addEventListener("hashchange", checkHash);
    checkHash();
  </script>
</body>
</html>
